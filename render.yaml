services:
  # ─── Laravel API Backend (Docker) ────────────────────────────────────────────
  - type: web
    name: royal-delivery-backend
    runtime: docker
    region: singapore   # closest to Myanmar
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Royal Myawaddy Delivery"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://royal-delivery-backend.onrender.com   # update after creation
      - key: APP_TIMEZONE
        value: Asia/Yangon
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: database/database.sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: SANCTUM_STATEFUL_DOMAINS
        value: royal-delivery-frontend.onrender.com   # update after creation
      - key: FRONTEND_URL
        value: https://royal-delivery-frontend.onrender.com  # update after creation

  # ─── React Frontend ───────────────────────────────────────────────────────────
  - type: web
    name: royal-delivery-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_BASE_URL
        value: https://royal-delivery-backend.onrender.com/api/v1  # update after creation
    routes:
      - type: rewrite
        source: /*
        destination: /index.html